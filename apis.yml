name: Powernaut
description: Powernaut is a Virtual Power Plant (VPP) and energy-flexibility platform for energy retailers and
  independent power producers. Its Energy Operations Workspace connects and aggregates distributed energy resources
  — solar, batteries, EVs and HVAC — then forecasts, optimizes and trades their flexibility across day-ahead, intraday,
  imbalance, congestion and ancillary-service markets. The Powernaut Partner API (OpenAPI 3.0) exposes site and
  resource connectivity, credential management, baselining, market bidding, forecasting, sensor readings and metrics.
  Powernaut BV is based in Gent, Belgium and is backed by Seedcamp.
