            RequestBody body = RequestBody.create(mediaType, "{\n 
            \"target_type\": \"<string>\",\n  \"target_id\": \"<uuid>\",\n 
            \"file_name\": \"<string>\"\n}");

            Request request = new Request.Builder()
              .url("https://api.powernaut.io/v1/connect/historical-data/upload-url")
