                  "grid_identifier": "<string>",
                  "direction": "bidirectional"
                },
                {
                  "grid_identifier": "<string>",
                  "direction": "bidirectional"
                }
              ],
              "grid_identifier": "<string>",
              "external_id": "<string>",
              "infer_meter_data_from_resources": False
