  /v1/connect/sites/{id}/markets:
    get:
      description: >-
        Retrieves the markets a site can have access to.


        Whether a market is available or not depends on the combination of a few
        factors:


        - Whether or not the owner of the site is contractually connected to the
        market via its supplier

        - Whether or not the site is located in the market's service area
        (geographically)


        - Whether or not the site and its resources meet the market's
        eligibility criteria (technical requirements)


        The result contains all contractually available markets, with a `status`
        property indicating whether or not the site can access the market.


        The different values of the market status of a site are:


        - `active` - The site is active on this market.


        - `ineligible` - The site is not eligible for this market (for example
        due to technical, or geographical reasons).


        - `action_required` - Further action is required from the site to
        activate this market.


        When the status is `action_required`, further action is required to
        activate the market. Look at the `action` property for more information.
      operationId: MarketsSite
      parameters:
        - name: id
          required: true
          in: path
          description: Identifier of the site you want to get markets for.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Markets
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/MarketActiveDto'
                      title: Active
                    - $ref: '#/components/schemas/MarketUnavailableDto'
                      title: Unavailable
                    - $ref: '#/components/schemas/MarketActionRequiredDto'
                      title: Action Required
                  discriminator:
                    propertyName: status
                    mapping:
                      active: '#/components/schemas/MarketActiveDto'
                      unavailable: '#/components/schemas/MarketUnavailableDto'
                      action_required: '#/components/schemas/MarketActionRequiredDto'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestExceptionDto'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedExceptionDto'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenExceptionDto'
        '404':
          description: Site does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundDto_U2l0ZSBkb2VzIG5vdCBleGlzdA'
      security:
        - cloud-cloud: []
      summary: Site markets
      tags:
        - markets
