openapi: 3.0.0
paths:
  /v1/auth/token:
    post:
      description: >-
        Gets an authentication access token, to be used to authenticate calls to
        all other endpoints.


        Include this token in the headers of all other endpoint calls:


        ```

        Authorization: Bearer <token>

        ```
      operationId: GetToken
      parameters:
        - name: authorization
          required: true
          in: header
          description: >-
            Header value for HTTP Basic authentication.


            To encode the credentials:

            1. Concatenate the url encoded client id and secret with a colon
            (`:`) in between: `clientid:client_secret`

            2. Encode the result with Base64: `base64(clientid:client_secret)`

            3. Include the result in the `Authorization` header prefixed with
            `Basic `.


            Example:


            ```

            Authorization: Basic Y2xpZW50X2lkOmNsaWVudF9zZWNyZXQ=

            ```
          schema:
            type: string
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenDto'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestExceptionDto'
        '403':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenDto_SW52YWxpZCBjcmVkZW50aWFscw'
      security:
        - token: []
      summary: Get a token
      tags:
        - authentication
        - authentication
      x-codeSamples:
        - source: >
            import requests


            url = "https://api.powernaut.io/v1/auth/token"


            payload = {}

            headers = {
              'Accept': 'application/json'
            }


            response = requests.request("POST", url, headers=headers,
            data=payload)


            print(response.text)
          lang: python
          label: Python
        - source: |-
            const myHeaders = new Headers();
            myHeaders.append("Accept", "application/json");

            const requestOptions = {
              method: "POST",
              headers: myHeaders,
              redirect: "follow"
            };

            fetch("https://api.powernaut.io/v1/auth/token", requestOptions)
              .then((response) => response.text())
              .then((result) => console.log(result))
              .catch((error) => console.error(error));
          lang: javascript
          label: JavaScript
        - source: |-
            OkHttpClient client = new OkHttpClient().newBuilder()
              .build();
            MediaType mediaType = MediaType.parse("text/plain");
            RequestBody body = RequestBody.create(mediaType, "");
            Request request = new Request.Builder()
              .url("https://api.powernaut.io/v1/auth/token")
              .method("POST", body)
              .addHeader("Accept", "application/json")
              .build();
            Response response = client.newCall(request).execute();
          lang: java
          label: Java
        - source: |-
            package main

            import (
              "fmt"
              "net/http"
              "io/ioutil"
            )

            func main() {

              url := "https://api.powernaut.io/v1/auth/token"
              method := "POST"

              client := &http.Client {
              }
              req, err := http.NewRequest(method, url, nil)

              if err != nil {
                fmt.Println(err)
                return
              }
              req.Header.Add("Accept", "application/json")

              res, err := client.Do(req)
              if err != nil {
                fmt.Println(err)
                return
              }
              defer res.Body.Close()

              body, err := ioutil.ReadAll(res.Body)
              if err != nil {
                fmt.Println(err)
                return
              }
              fmt.Println(string(body))
            }
          lang: go
          label: Go
        - source: >
            var client = new HttpClient();

            var request = new HttpRequestMessage(HttpMethod.Post,
            "https://api.powernaut.io/v1/auth/token");

            request.Headers.Add("Accept", "application/json");

            var response = await client.SendAsync(request);

            response.EnsureSuccessStatusCode();

            Console.WriteLine(await response.Content.ReadAsStringAsync());
          lang: csharp
          label: C#
        - source: >-
