  /v1/connect/sites/{id}/credentials/rotate:
    post:
      description: >-
        Creates new credentials and marks the old ones for rotation.


        Both sets of credentials remain valid until the rotation is either
        completed or canceled. This allows for a seamless transition between the
        old and new credentials, ensuring that there is no downtime or
        disruption in service during the rotation process.


        Optional `name` selects which logical credential set to rotate (defaults
        to `"Default"`).
      operationId: SitesController_startRotation_v1
      parameters:
        - name: id
          required: true
          in: path
          description: Site ID
          schema:
            type: string
            format: uuid
        - name: name
          required: false
          in: query
          description: >-
            Credential slot to rotate. When omitted, the `"Default"` credential
            is rotated.
          schema:
            minLength: 1
            maxLength: 512
            type: string
      responses:
        '200':
          description: New credentials created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionPointCredentialDto'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestExceptionDto'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedExceptionDto'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenExceptionDto'
      security:
        - cloud-cloud: []
      summary: Rotate credentials
      tags:
        - sites
  /v1/connect/sites/{id}/credentials/rotate/complete:
    post:
      description: >-
        Completes the credential rotation process by permanently removing the
        old credentials from the system. Once this operation is performed, the
        old credentials will no longer be valid and this action cannot be
        undone.


        Optional `name` completes rotation for that slot (defaults to
        `"Default"`).
      operationId: SitesController_completeRotation_v1
      parameters:
        - name: id
          required: true
          in: path
          description: Site ID
          schema:
            type: string
            format: uuid
        - name: name
          required: false
          in: query
          description: >-
            Credential slot whose rotation should be finalised. When omitted,
            `"Default"` is completed.
          schema:
            minLength: 1
            maxLength: 512
            type: string
      responses:
        '204':
          description: Rotation completed successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestExceptionDto'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedExceptionDto'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenExceptionDto'
      security:
        - cloud-cloud: []
      summary: Complete credential rotation
      tags:
        - sites
  /v1/connect/sites/{id}/credentials/rotate/cancel:
    post:
      description: >-
        Cancels the credential rotation process. This action will remove the
        newly generated credentials and retain the old credentials, keeping them
        active and valid.


        Optional `name` cancels rotation for that slot (defaults to
        `"Default"`).
      operationId: SitesController_cancelRotation_v1
      parameters:
        - name: id
          required: true
          in: path
          description: Site ID
          schema:
            type: string
            format: uuid
        - name: name
          required: false
          in: query
          description: >-
            Credential slot whose rotation should be cancelled. When omitted,
            `"Default"` is cancelled.
          schema:
            minLength: 1
            maxLength: 512
            type: string
      responses:
        '204':
          description: Rotation canceled successfully
        '400':
