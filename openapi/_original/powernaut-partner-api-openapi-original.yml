  /v1/connect/sites/{id}:
    get:
      description: Gets a site by its unique ID.
      operationId: GetSite
      parameters:
        - name: id
          required: true
          in: path
          description: Identifier of the site.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionPointDto'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestExceptionDto'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedExceptionDto'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenExceptionDto'
        '404':
          description: Site does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundDto_U2l0ZSBkb2VzIG5vdCBleGlzdA'
      security:
        - edge-cloud: []
        - cloud-cloud: []
      summary: Get a site
      tags:
        - sites
    patch:
      description: >-
        Update a site by its unique ID.


        Only the properties you provide will be updated. Use `null` to unset a
        property.
      operationId: UpdateSite
      parameters:
        - name: id
          required: true
          in: path
          description: Identifier of the site you want to update.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectionPointDto'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionPointDto'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestExceptionDto'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedExceptionDto'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenExceptionDto'
        '404':
          description: Site does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundDto_U2l0ZSBkb2VzIG5vdCBleGlzdA'
      security:
        - cloud-cloud: []
      summary: Update a site
      tags:
        - sites
    delete:
      description: >-
        Delete a site


        **Important**: This action is irreversible and will remove all
        associated resources, future bids, and baselines.
      operationId: RemoveSite
      parameters:
        - name: id
          required: true
