  /v1/connect/sensors/{id}/readings:
    get:
      description: >-
        Returns 15-minute average readings for a single sensor over a `[start,
        end)` window. Sensors emitting at higher cadence (e.g. 1- or 5-minute)
        are normalised by averaging all raw samples within each quarter-hour
        bucket. Buckets with no readings are omitted. Timestamps are the start
        of the bucket and are returned in UTC.
      operationId: GetSensorReadings
      parameters:
        - name: id
          required: true
          in: path
          description: Identifier of the sensor (UUID).
          schema:
            type: string
            format: uuid
        - name: start
          required: true
          in: query
          description: >-
            Start of the window (ISO 8601 with timezone, e.g.
            `2026-01-15T00:00:00Z`). Inclusive.
          schema:
            example: '2026-01-15T00:00:00Z'
            type: string
        - name: end
          required: true
          in: query
          description: End of the window (ISO 8601 with timezone). Exclusive.
          schema:
            example: '2026-01-16T00:00:00Z'
            type: string
        - name: page
          required: false
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number. Defaults to 1.
        - name: page_size
          required: false
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
          description: Readings per page. Defaults to 1000, maximum 10000.
        - name: measurement
          required: false
          in: query
          description: >-
            Measurement channel to return, matching one of the sensor's
            `measurements[].key` values (e.g. `irradiance`, `cell_temperature`,
            `external_temperature`, `wind_speed`). Optional; defaults to
            `irradiance` when omitted.
          schema:
            example: irradiance
            type: string
      responses:
        '200':
          description: Paginated raw readings for the requested window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorReadingsListDto'
        '400':
          description: Invalid time window or pagination parameters.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/BadRequestDto_SW52YWxpZCB0aW1lIHdpbmRvdyBvciBwYWdpbmF0aW9uIHBhcmFtZXRlcnMu
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedDto_VW5hdXRob3JpemVk'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenDto_Rm9yYmlkZGVu'
        '404':
          description: Sensor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundDto_U2Vuc29yIG5vdCBmb3VuZA'
      security:
        - cloud-cloud: []
      summary: Get sensor readings (15-minute averages)
      tags:
        - sensor_data
info:
  title: Powernaut
  description: >

    # Getting Started


    Welcome to the Powernaut API Reference!


    Our API offers a robust and secure way to connect your flexible resources to
    flexibility buyers such as energy utilities/suppliers and system operators.


    This OpenAPI documentation is designed to provide a comprehensive and
    easy-to-understand guide for developers who are integrating their systems
    with Powernaut’s platform.


    By leveraging our API, you can seamlessly offer flexibility in several
    electricity markets, opening up additional revenue streams

    for your resources while contributing to a greener and more efficient
    electricity grid.
  version: 1.0.0
  contact:
    name: Powernaut Support
    url: https://powernaut.io
    email: support@powernaut.io
  license:
    name: Creative Commons Attribution-ShareAlike 4.0 International
    url: https://creativecommons.org/licenses/by-sa/4.0/
tags:
  - name: authentication
    description: Authenticating with the Powernaut platform.
    x-displayName: Authentication
  - name: sites
    description: >-
      Register, modify or delete sites.


      Sites are the start of everything, they are required to uniquely identify
      the end consumer's connection to the grid. They define the meter point(s)
      for which flexibility is activated.


      ⚠️ The `/v1/connect/connection-points` endpoints have moved to
      `/v1/connect/sites`. The original paths have been deprecated.
    x-displayName: Sites
  - name: resources
    description: >-
      Register, modify or delete flexible resources.


      You can add flexible resources to each site, such as batteries, heat
      pumps, electric vehicles, ... They are the physical resource that can
      offer flexibility.


      Each resource has an enrolment status for the markets it can participate
      in, which you can query.
    x-displayName: Resources
  - name: managing_bids
    description: >-
      Manage your bids. You can update, cancel and receive notifications about
      bids.


      When a bid is accepted, you either get notified or you poll for status
      updates.


      Read more [here](/guides/connect/activating-flexibility/activating)
    x-displayName: Bids
  - name: baselining
    description: >-
      With baselining, you indicate your normal consumption/production
      behaviour.


      This baseline is essential to provide flexibility, which is then defined
      as a deviation from this baseline. You can provide a baseline either for a
      site, or a resource.


      See the [guide](/guides/connect/activating-flexibility/baselining) for
      more information.
    x-displayName: Baselining
  - name: creating_bids
    description: A bid tells us how much flexibility is available in a certain time window.
    x-displayName: Bidding
  - name: accepting_bids
    description: >-
      Bids get accepted when there's a need for them. You need to activate when
      they get accepted, i.e. act on the requested flexibility.
    x-displayName: Activating
  - name: markets
    description: >-
      Markets are the electricity markets in which you can participate.

      Each market has a set of eligibility criteria, which you can query to see
      if you can participate in a certain market.


      Read our [guide](/guides/connect/markets) for more information.
    x-displayName: Markets
  - name: metrics
    description: Metrics reported by resources and sites
    x-displayName: Metrics
  - name: uploading_forecasts
    description: >-
      Sharing your forecasts helps us better understand your resources' expected
      behaviour, leading to improved flexibility opportunities and optimised
      market participation.


      See the [guide](/guides/connect/forecasting/uploading-forecasts) for more
      information.
    x-displayName: Uploading forecasts
  - name: getting_forecasts
    description: >-
      You can retrieve forecasts to help plan your flexibility offerings and
      understand expected power consumption or production patterns.


      See the [guide](/guides/connect/forecasting/getting-forecasts) for more
      information.
    x-displayName: Getting forecasts
  - name: events
    description: >-
      Events are EMS-initiated control actions that deviate from a resource's
      default behaviour (e.g. PV curtailment due to negative tariffs).


      Reporting these events helps us maintain clean training data for more
      accurate forecasting.


      See the [guide](/guides/connect/forecasting/reporting-events) for more
      information.
    x-displayName: Events
  - name: historical_data
    description: >-
      Upload historical meter data for your sites.


      Use these endpoints to import historical consumption and production data
      via CSV files.
    x-displayName: Historical Data
  - name: sensor_data
    description: >-
      Read raw time series data from sensors attached to your sites, such as
      irradiance sensors on PV installations.


      Useful when you need measured conditions alongside metering data, for
      example to estimate PV output during curtailment windows.


      See the [guide](/guides/connect/sensor-data/reading-sensor-data) for more
      information.
    x-displayName: Sensor data
servers:
  - url: https://api.sandbox.powernaut.io
    description: Sandbox
  - url: https://api.powernaut.io
    description: Production
components:
  securitySchemes:
    cloud-cloud:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: A bearer token obtained from the token endpoint.
    token:
      type: http
      scheme: basic
      description: >-
        Your client id and secret to obtain a bearer token for cloud-cloud
        authentication.
    edge-cloud:
      type: http
      scheme: basic
      description: >-
        Basic credentials used for edge-cloud authentication. They can be
        obtained when creating a site.
  schemas:
    BadRequestExceptionDto:
      type: object
      properties:
        message:
          description: One or more specific error messages
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example:
            - Invalid datetime
            - Invalid page size
        error:
          type: string
          description: Bad Request
          example: Bad Request
        status_code:
          type: number
          description: '400'
          example: 400
      required:
        - message
        - error
        - status_code
    TokenDto:
      type: object
      properties:
        access_token:
          type: string
          description: The access token
        expires_in:
          type: number
          description: The lifetime of the token, in seconds
          example: 3600
        token_type:
          type: string
          description: The token type, only `Bearer` is supported
          example: Bearer
          enum:
            - Bearer
      required:
        - access_token
        - expires_in
        - token_type
    ForbiddenDto_SW52YWxpZCBjcmVkZW50aWFscw:
      type: object
      properties:
        message:
          description: One or more specific error messages
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: Invalid credentials
        error:
          type: string
          description: Forbidden
          example: Forbidden
        status_code:
          type: number
          description: '403'
          example: 403
      required:
        - message
        - error
        - status_code
    UnauthorizedExceptionDto:
      type: object
      properties:
        message:
          description: One or more specific error messages
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: Unauthorized
        error:
          type: string
          description: Unauthorized
          example: Unauthorized
        status_code:
          type: number
          description: '401'
          example: 401
      required:
        - message
        - error
        - status_code
    ForbiddenExceptionDto:
      type: object
      properties:
        message:
          description: One or more specific error messages
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: Insufficient permissions
        error:
          type: string
          description: Forbidden
          example: Forbidden
        status_code:
          type: number
          description: '403'
          example: 403
      required:
        - message
        - error
        - status_code
    AddressLocationDto:
      type: object
      properties:
        address:
          type: string
          description: Full-text address, including country
          example: Full-text address, including country
      required:
        - address
    GeoLocationDto:
      type: object
      properties:
        latitude:
          type: string
          description: Latitude of the location
          example: '4.4764595'
          format: decimal
        longitude:
