x-webhooks:
  bidAccepted:
    post:
      operationId: WebhookBidAccepted
      description: >+
        During bidding, you can set a webhook to receive activation events on.


        ### Fetching details


        To make webhooks easy to implement, while also being secure, a webhook
        contains only a single reference to the bid that was accepted. You
        should use this reference to fetch the activation details by looking up
        the accepted bid.


        See [this endpoint](#tag/managing_bids/operation/GetBid) for details on
        how to look up activation details.


        ### Retries


        You should reply with a `2XX` status code, indicating you have
        successfully activated the asset.

        You can also reply with a `406` status code if you notice that the
        activation cannot be delivered upon for some reason (e.g. a suddenly
        disconnected car).


        We will retry your webhook up to 3 times in case you:


        1. Do not reply with a `2XX` or `406` status code or,

        2. We do not get a successful reply within 5 seconds


        Our portal shows a log of both successful and failed webhook calls.

      summary: Receive an accepted bid
      tags:
        - accepting_bids
      security: []
      parameters:
        - name: X-Powernaut-Webhook-Version
          description: >-
            A version indicator for this webhook, used to track changes to the
            webhook implementation. At the moment, this is always `v1`.
          example: v1
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidAcceptedDto'
      responses:
        '202':
          description: Successfully processed
