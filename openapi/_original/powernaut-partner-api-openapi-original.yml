      description: >-
        Creates a new named credential pair for this site and returns the
        plaintext secret once.


        Provide a unique logical `name` when you need more than the default
        credential set. Omit `name` only to create the primary `"Default"` slot
        when it does not yet exist.
      operationId: SitesController_createCredentials_v1
      parameters:
        - name: id
          required: true
          in: path
          description: Site ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: Credential name parameters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectionPointCredentialDto'
      responses:
        '201':
