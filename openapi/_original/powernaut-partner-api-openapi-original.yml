    TimeWindowDto:
      type: object
      properties:
        start:
          type: string
          description: >-
            Start of window (ISO 8601). Must be a perfect quarter-hour.


            **Note**: To avoid timezone issues, we perform an additional check
            for the presence of timezone information. You should always include
            either UTC with `Z`, or an offset like `+01:00`.
          format: date-time
          example: '2024-07-01T14:00:00Z'
        end:
          type: string
          description: >-
            End of window (ISO 8601). Must be a perfect quarter-hour, and
            exactly one quarter hour after `start`.


            **Note**: To avoid timezone issues, we perform an additional check
            for the presence of timezone information. You should always include
            either UTC with `Z`, or an offset like `+01:00`.
          format: date-time
          example: '2024-07-01T14:15:00Z'
      required:
        - start
        - end
    PricePointDto:
      type: object
      properties:
        value:
          type: string
          description: >-
            The value of the bid, i.e. the active/reactive power you're willing
            to import/export for the price point (in `kW` or `kVAR`, depending
            on the bid's power type). Use a positive number for grid import
            (more consumption/less production) and negative for export to the
            grid (more production/less consumption).


            This cannot exceed the maximum power constraints for the resource.
          example: '5.1'
          format: decimal
          pattern: ^-?[0-9]{1,15}(.[0-9]{1,6}?)$
        price:
          type: string
          description: >-
            The unit price constraint for which this price point is valid (e.g.
            €/kWh or €/kVARh).
             For example, you might not want to activate your flexible power if the value of flexibility at that point is less than 0.30 EUR/kWh.

            This can be left empty, in which case the bid is always valid (no
            matter the price for flexibility at that point).


            **Note:** The currency is automatically inferred based on the site.
          example: '5.1'
          format: decimal
          pattern: ^-?[0-9]{1,15}(.[0-9]{1,5}?)$
      required:
        - value
    BidWebhooksDto:
      type: object
      properties:
        accepted:
          type: string
          description: >-
            Webhook at which you'd like to receive a notification of acceptance
            for bids made for this resource. For more information on the webhook
            content, see [the
            specifications](#tag/accepting_bids/operation/WebhookBidAccepted).


            This is optional, and if not provided, activation via MQTT will be
            used instead. For more information on other notification options,
            see [this guide](/guides/connect/activating-flexibility/activating).
          example: https://domain.tld/path
          format: uri
    CreateBidDto:
      type: object
      properties:
        timing:
          description: >-
            Time window when the power is available (e.g., 18:00-18:15). This
            must be a perfect quarter-hour in length.


            Only one bid per resource is allowed per time window.
          allOf:
            - $ref: '#/components/schemas/TimeWindowDto'
        power_type:
          type: string
          description: >-
            Type of power for this bid (active vs. reactive). Defaults to
            `active`.
          enum:
            - active
            - reactive
          example: active
        curve:
          description: >-
            The bid curve, see the
            [guide](/guides/connect/activating-flexibility/bidding) for more
            information.
          minItems: 1
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/PricePointDto'
        expires_at:
          type: string
          description: >-
            When this bid should expire (ISO 8601).


            This can be used to automatically expire bids at a certain time,
            e.g. when you need enough time to react on its acceptance.


            **Note**: To avoid timezone issues, we perform an additional check
            for the presence of timezone information. You should always include
            either UTC with `Z`, or an offset like `+01:00`.
          format: date-time
          example: '2024-01-05T11:30:15Z'
        webhooks:
          description: >-
            Webhooks related to this bid, for example to be notified about a
            bid's acceptance.
          allOf:
            - $ref: '#/components/schemas/BidWebhooksDto'
      required:
        - timing
        - curve
    BidAcceptedDto:
      type: object
      properties:
