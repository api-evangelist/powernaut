          type: string
          description: >-
            Identifier for the bid that has been accepted. You can use this to
            look up the details of the activation.
          format: uuid
      required:
        - id
    ActivationDto:
      type: object
      properties:
        value:
          type: string
          description: >-
            Requested power value by the activation, in `kW` or `kVAR`
            (depending on the bid's type). Can be any of the values on the given
            bid curve.


            The resource should set its setpoint to this value during the time
            of the bid.


            **Note**: This value can also be `null`, which simply means we no
            longer request you to follow any particular setpoint. You should
            return to your baseline, or default steering mode.
          example: '5.1'
          format: decimal
          pattern: ^-?[0-9]{1,15}(.[0-9]{1,6}?)$
          nullable: true
        price:
          type: string
          description: >-
            The price value of the point on the bid curve corresponding with the
            requested power. This is purely informative.
          example: '5.1'
          format: decimal
          pattern: ^-?[0-9]{1,15}(.[0-9]{1,5}?)$
        created_at:
          type: string
          description: >-
            Time when the most recent activation was created, i.e. when the bid
            was accepted (ISO 8601)
          format: date-time
          example: '2024-07-01T14:00:00Z'
        canceled_at:
          type: object
          description: Time when the most recent activation was canceled (ISO 8601)
          format: date-time
          example: '2024-07-01T14:00:00Z'
        type:
          type: string
          description: >-
            The flex delivery mode for this activation. `exact` — hold the
            requested setpoint. `maximise_upwards` / `maximise_downwards` —
            deliver as much flex as possible in the given direction.
          enum:
            - exact
            - maximise_upwards
            - maximise_downwards
          example: exact
      required:
        - value
        - price
        - created_at
        - type
    BidReportDto:
      type: object
      properties:
        energy_requested:
          type: string
          description: >-
            Total energy requested for this bid, in `kWh` or `kVARh`, based on
            an initial estimate of available flexibility.


            **Sign convention**: A negative value indicates downward
            flexibility, whereas a positive value indicates upward flexibility.
          example: '15.500000'
        energy_delivered:
          type: string
          description: >-
            Total energy delivered for this bid, in `kWh` or `kVARh`, verified
            by real-time metering.


            **Sign convention**:

            - A negative value indicates downward flexibility, whereas a
            positive value indicates upward flexibility.

            - If the sign is different from `energy_requested`, it indicates
            that the bid was delivered in the wrong direction.
          example: '14.750000'
        extra_energy_delivered:
          type: string
          description: >-
            Portion of `energy_delivered` that exceeds the requested amount (in
            `kWh` or `kVARh`).


            `"0.000000"` when no extra delivery occurred. Only non-zero for
            `maximise_upwards` and `maximise_downwards` activation types;
            `exact` activations always return `null` because over-delivery is
            not tracked for those.


            **Sign convention**: Follows the sign of `energy_delivered` —
            negative for `maximise_downwards`, positive for `maximise_upwards`.

            - `maximise_upwards` with 3 kWh of over-delivery → `"3.000000"` (>=
            0)

            - `maximise_downwards` with 3 kWh of over-delivery → `"-3.000000"`
            (<= 0)
          example: '2.500000'
          nullable: true
      required:
        - energy_requested
        - energy_delivered
        - extra_energy_delivered
    BidDto:
      type: object
      properties:
        timing:
          description: >-
            Time window when the power is available (e.g., 18:00-18:15). This
            must be a perfect quarter-hour in length.


            Only one bid per resource is allowed per time window.
          allOf:
            - $ref: '#/components/schemas/TimeWindowDto'
        power_type:
          type: string
          description: >-
            Type of power for this bid (active vs. reactive). Defaults to
            `active`.
          enum:
            - active
            - reactive
          example: active
        curve:
          description: >-
            The bid curve, see the
            [guide](/guides/connect/activating-flexibility/bidding) for more
            information.
          minItems: 1
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/PricePointDto'
        expires_at:
          type: string
          description: >-
            When this bid should expire (ISO 8601).


            This can be used to automatically expire bids at a certain time,
            e.g. when you need enough time to react on its acceptance.


            **Note**: To avoid timezone issues, we perform an additional check
            for the presence of timezone information. You should always include
            either UTC with `Z`, or an offset like `+01:00`.
          format: date-time
          example: '2024-01-05T11:30:15Z'
        webhooks:
          description: >-
            Webhooks related to this bid, for example to be notified about a
            bid's acceptance.
          allOf:
            - $ref: '#/components/schemas/BidWebhooksDto'
        id:
          type: string
          description: Unique identifier for the bid
          format: uuid
        resource_id:
          type: string
          description: Identifier of the resource that made this bid.
          format: uuid
        baseline:
          type: string
          description: The baseline value for this bid's time window.
          example: '5.000000'
        status:
          type: string
          description: >
            The status of the bid.


            - **Open**: The bid has neither been accepted or rejected and is
            open for activation.

            - **Accepted**: The bid has been accepted and should be acted upon.

            - **Expired**: The bid has expired and is no longer available for
            activation.
          enum:
            - open
            - accepted
            - expired
          example: open
        activation:
          description: >-
            When a bid is accepted, details of the requested activation can be
            found here.
          allOf:
            - $ref: '#/components/schemas/ActivationDto'
        report:
          description: >-
            Energy report for this bid, including total energy requested and
            delivered.


            This is `null` until a few minutes after the time window of the bid.
          allOf:
            - $ref: '#/components/schemas/BidReportDto'
        created_at:
          type: string
          description: Timestamp for creation of the bid (ISO 8601)
          format: date-time
          example: '2024-01-05T11:30:15Z'
        modified_at:
          type: string
          description: Timestamp for last modification of the bid (ISO 8601)
          format: date-time
          example: '2024-01-05T11:30:15Z'
      required:
        - timing
        - power_type
        - curve
        - webhooks
        - id
        - resource_id
        - baseline
        - status
        - created_at
        - modified_at
