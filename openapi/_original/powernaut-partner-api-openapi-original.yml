  /v1/connect/sites/{id}/baseline:
    get:
      description: Retrieve baseline data for the site (`active` power only).
      operationId: RetrieveBaselineSite
      parameters:
        - name: id
          required: true
          in: path
          description: Identifier of the site you want to retrieve the baseline data for.
          schema:
            type: string
            format: uuid
        - name: amount
          required: true
          in: query
          description: Number of timesteps to be included in the time window.
          schema:
            minimum: 1
            maximum: 192
            type: number
        - name: start
          required: true
          in: query
          description: >-
            Start of window (ISO 8601). Must be a perfect minute without seconds
            or milliseconds precision.


            **Note**: To avoid timezone issues, we perform an additional check
            for the presence of timezone information. You should always include
            either UTC with `Z`, or an offset like `+01:00`.
          schema:
            type: string
        - name: granularity
          required: true
          in: query
          description: >-
            The granularity to fetch the state for, i.e. the time length of each
            element.


            It cannot be smaller than 1 minute, and cannot contain sub-minute
            precision.


            The expected format is <a
            href="https://en.wikipedia.org/wiki/ISO_8601#Durations"
            target="_blank">ISO8601</a>.
          schema:
            type: string
      responses:
        '200':
          description: Baseline data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineDto'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestExceptionDto'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedExceptionDto'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenExceptionDto'
        '404':
          description: Site does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundDto_U2l0ZSBkb2VzIG5vdCBleGlzdA'
        '409':
          description: >-
            Cannot update baseline: there have been activations in this time
            window
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/ConflictDto_Q2Fubm90IHVwZGF0ZSBiYXNlbGluZTogdGhlcmUgaGF2ZSBiZWVuIGFjdGl2YXRpb25zIGluIHRoaXMgdGltZSB3aW5kb3c
      security:
        - edge-cloud: []
        - cloud-cloud: []
      summary: Site baseline
      tags:
        - baselining
    post:
      description: >-
        Add a baseline for a site.


        This operation will override any existing baseline values that might
        overlap.
      operationId: BaselineSite
      parameters:
        - name: id
          required: true
          in: path
          description: Identifier of the site you want to add a baseline for.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBaselineDto'
      responses:
        '201':
          description: Created
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestExceptionDto'
        '401':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedExceptionDto'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenExceptionDto'
        '404':
          description: Site does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundDto_U2l0ZSBkb2VzIG5vdCBleGlzdA'
      security:
        - edge-cloud: []
        - cloud-cloud: []
      summary: Site
      tags:
        - baselining
  /v1/connect/sites/{id}/credentials:
