    CreateBaselineDto:
      type: object
      properties:
        start:
          type: string
          description: >-
            Start of window (ISO 8601). Must be a perfect quarter-hour.


            **Constraints**: This must be at least the current quarter-hour, and
            cannot be more than 192 quarter-hours in the future.


            **Length**: Each baseline value is for a period of a quarter-hour,
            so the length of this period is defined by the amount of elements in
            `values`.


            **Note**: To avoid timezone issues, we perform an additional check
            for the presence of timezone information. You should always include
            either UTC with `Z`, or an offset like `+01:00`.
          example: '2024-07-01T14:00:00Z'
        power_type:
          type: string
          description: >-
            Type of power for this baseline (active vs. reactive). Defaults to
            `active`.
          enum:
            - active
            - reactive
          example: active
        values:
          description: >-
            The baseline values, starting from timestamp `start`.


            This is the active/reactive power that will be imported/exported (in
            `kW` or `kVAR`, depending on the power type). Use a positive number
            for grid import and negative for export to the grid.


            Supports up to 192 elements.
          minItems: 1
          maxItems: 192
          type: array
          items:
            type: string
        skip_activated_windows:
          type: boolean
          description: >-
            When true, windows with activations are skipped instead of failing
            the request.
      required:
        - start
        - values
